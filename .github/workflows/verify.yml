name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - name: Test with locked dependencies
        run: uv run --project backend --frozen python -m unittest discover -s tests -v

  frontend:
    name: Vercel handlers and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install locked server dependencies
        run: npm ci --no-audit --no-fund
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Test authenticated gateway
        run: npm run test:proxy
      - name: Test official law database gateway
        run: node --test tests/official.test.mjs
      - name: Build public frontend
        env:
          VITE_REQUIRE_LOGIN: "true"
          VITE_PUBLIC_PREVIEW: "true"
        run: npm run build --prefix frontend
