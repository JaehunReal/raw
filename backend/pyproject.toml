[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rulecraft"
version = "0.1.0"
description = "Markdown legal knowledge graph and amendment workspace"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "uvicorn==0.52.1",
  "PyYAML==6.0.3",
  "mcp==1.29.0",
  "httpx==0.28.1",
]

[project.scripts]
rulecraft-mcp = "rulecraft.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rulecraft*"]
